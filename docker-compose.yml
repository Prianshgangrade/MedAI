services:
  mysql:
    image: mysql:8.0
    container_name: medpulse-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: medpulse_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - medpulse-net

  mongodb:
    image: mongo:7.0
    container_name: medpulse-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - medpulse-net

  user-service:
    build: ./user-service
    container_name: medpulse-user-service
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass
      MYSQL_DB: medpulse_db
    ports:
      - "8001:8001"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - medpulse-net

  advisory-service:
    build: ./advisory-service
    container_name: medpulse-advisory-service
    environment:
      MONGO_URI: mongodb://mongodb:27017/
      MONGO_DB: medpulse_db
    ports:
      - "8002:8002"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - medpulse-net

  search-rec-service:
    build: ./search-rec-service
    container_name: medpulse-search-rec-service
    environment:
      ADVISORY_SVC_URL: http://advisory-service:8002/advisories
      INDEX_PATH: /app/advisories.index
      META_PATH: /app/advisories_meta.json
    ports:
      - "8003:8003"
    depends_on:
      - advisory-service
    networks:
      - medpulse-net

  chatbot-service:
    build: ./chatbot-service
    container_name: medpulse-chatbot-service
    environment:
      SEARCH_SVC_URL: http://search-rec-service:8003/search
      MONGO_URI: mongodb://mongodb:27017/
      MONGO_DB: medpulse_db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8004:8004"
    depends_on:
      mongodb:
        condition: service_healthy
      search-rec-service:
        condition: service_started
    networks:
      - medpulse-net

  gateway-ui-service:
    build: ./gateway-ui-service
    container_name: medpulse-gateway-ui-service
    environment:
      USER_SVC_URL: http://user-service:8001
      ADVISORY_SVC_URL: http://advisory-service:8002
      SEARCH_SVC_URL: http://search-rec-service:8003
      CHATBOT_SVC_URL: http://chatbot-service:8004
    ports:
      - "8000:8000"
    depends_on:
      - user-service
      - advisory-service
      - search-rec-service
      - chatbot-service
    networks:
      - medpulse-net

networks:
  medpulse-net:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
